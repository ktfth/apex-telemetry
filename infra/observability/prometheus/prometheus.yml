global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'apex-api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'apex-analytics'
    static_configs:
      - targets: ['analytics:8081']

  - job_name: 'apex-ingest'
    static_configs:
      - targets: ['ingest:8082']

  - job_name: 'apex-strategy-hs'
    static_configs:
      - targets: ['strategy-hs:8083']
