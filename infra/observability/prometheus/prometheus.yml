global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # O gateway é o único serviço que expõe /metrics. O motor de análise é uma
  # biblioteca ligada ao gateway, a ingestão é um processo em lote e o motor
  # Haskell é consultado sob demanda — nenhum deles é um alvo de scraping.
  - job_name: 'apex-api-gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: api-gateway-cpp
